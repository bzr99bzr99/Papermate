name: Feature request
description: Suggest an improvement for PaperMate
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What workflow is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature and how users would interact with it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Scope
      options:
        - label: I understand PaperMate is local-first and the proposal preserves local-only data by default.
          required: true
